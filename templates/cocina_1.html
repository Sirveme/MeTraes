<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS — Cocina | Metraes.com</title>
    
    <!-- Fuentes: Roboto Condensed para legibilidad a distancia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- CSS por componente (convención Metraes) -->
    <link rel="stylesheet" href="/static/css/cocina_1.css?v=2">
    <link rel="stylesheet" href="/static/css/cocina_1_cards.css?v=2">
    <link rel="stylesheet" href="/static/css/cocina_1_timer.css?v=2">
</head>
<body>
    <!-- ============================================ -->
    <!-- HEADER: Estaciones + Reloj + Estado conexión -->
    <!-- ============================================ -->
    <header id="kds-header">
        <div class="header-left">
            <h1 class="kds-title">🔥 COCINA</h1>
            <span id="connection-status" class="status-badge status-connecting">
                ⏳ Conectando...
            </span>
        </div>
        
        <nav id="station-filters" class="station-filters">
            <button class="station-btn active" data-station-id="all">
                TODAS
                <span class="station-count" id="count-all">0</span>
            </button>
            <!-- Se llena dinámicamente con las estaciones -->
        </nav>
        
        <div class="header-right">
            <span id="orders-count" class="orders-count">0 pedidos</span>
            <span id="clock" class="clock">--:--</span>
            <button id="btn-fullscreen" class="btn-icon" title="Pantalla completa">⛶</button>
            <button id="btn-sound" class="btn-icon sound-on" title="Sonido">🔊</button>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- GRID DE PEDIDOS (cards grandes para TV)      -->
    <!-- ============================================ -->
    <main id="kds-grid" class="kds-grid">
        <!-- Cards se generan dinámicamente -->
        
        <!-- Estado vacío -->
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">👨‍🍳</div>
            <div class="empty-text">Sin pedidos pendientes</div>
            <div class="empty-sub">Los pedidos aparecerán aquí en tiempo real</div>
        </div>
    </main>

    <!-- ============================================ -->
    <!-- ALERTA NUEVO PEDIDO (flash visual)           -->
    <!-- ============================================ -->
    <div id="new-order-flash" class="new-order-flash hidden">
        <div class="flash-content">
            <span class="flash-icon">🔔</span>
            <span class="flash-text">NUEVO PEDIDO</span>
            <span id="flash-detail" class="flash-detail">#001 - Mesa 5</span>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- AUDIO (sonidos de alerta)                    -->
    <!-- ============================================ -->
    <audio id="sound-new-order" preload="auto">
        <source src="/static/audio/new_order.wav" type="audio/wav">
    </audio>
    <audio id="sound-urgent" preload="auto">
        <source src="/static/audio/urgent.wav" type="audio/wav">
    </audio>

    <!-- ============================================ -->
    <!-- LOGIN PIN (si no hay token válido)           -->
    <!-- ============================================ -->
    <div id="pin-login" class="pin-overlay" style="display:none">
        <div class="pin-box">
            <div style="font-size:48px;margin-bottom:12px">🔥</div>
            <h2 style="font-size:24px;font-weight:900;margin-bottom:4px;color:#fff">COCINA</h2>
            <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:24px">Ingresa tu PIN para conectar</p>
            <input id="pin-input" type="tel" maxlength="6" placeholder="PIN"
                style="width:200px;padding:16px;font-size:28px;text-align:center;border:2px solid rgba(255,255,255,0.2);
                border-radius:12px;background:rgba(255,255,255,0.08);color:#fff;font-weight:900;letter-spacing:8px;
                font-family:monospace;outline:none" autocomplete="off">
            <br>
            <button id="pin-btn" onclick="doLogin()"
                style="margin-top:16px;padding:14px 48px;border:none;border-radius:12px;
                background:#e67e22;color:#fff;font-size:16px;font-weight:700;cursor:pointer;
                font-family:inherit">Entrar</button>
            <p id="pin-error" style="color:#ef4444;font-size:13px;margin-top:12px;display:none"></p>
        </div>
    </div>
    <style>
        .pin-overlay{position:fixed;inset:0;z-index:200;background:#0a0a14;
            display:flex;align-items:center;justify-content:center;text-align:center}
        .pin-box{padding:40px}
        #pin-input:focus{border-color:#e67e22}
    </style>
    <script>
        // Check if we have a valid token, if not show PIN login
        (function(){
            var token = localStorage.getItem('access_token');
            if (!token) {
                document.getElementById('pin-login').style.display = 'flex';
            }
            // Enter key on PIN input
            document.getElementById('pin-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doLogin();
            });
        })();
        function doLogin() {
            var pin = document.getElementById('pin-input').value;
            var rid = window.KDS_CONFIG.restaurant_id;
            var errEl = document.getElementById('pin-error');
            var btn = document.getElementById('pin-btn');
            if (!pin || pin.length < 4) { errEl.textContent = 'PIN de 4-6 dígitos'; errEl.style.display = 'block'; return; }
            btn.textContent = 'Conectando...'; btn.disabled = true;
            fetch('/api/v1/auth/login-pin', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({pin: pin, restaurant_id: rid})
            })
            .then(function(r) { if (!r.ok) throw new Error('PIN incorrecto'); return r.json(); })
            .then(function(data) {
                localStorage.setItem('access_token', data.access_token);
                document.getElementById('pin-login').style.display = 'none';
                // Reload to connect WebSocket with new token
                location.reload();
            })
            .catch(function(e) {
                errEl.textContent = e.message; errEl.style.display = 'block';
                btn.textContent = 'Entrar'; btn.disabled = false;
            });
        }
    </script>

    <!-- ============================================ -->
    <!-- CONFIG (inyectada por Jinja2 desde Python)   -->
    <!-- ============================================ -->
    <script>
        window.KDS_CONFIG = {{ config | tojson }};
    </script>

    <!-- JS por módulo (convención Metraes) -->
    <script src="/static/js/cocina_1_ws.js?v=4"></script>
    <script src="/static/js/cocina_1.js?v=4"></script>
</body>
</html>
