<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0a0a0f">
    <title>Cocina | Metraes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/cocina_movil.css?v=3">
</head>
<body>

<header class="header">
    <div class="header-left">
        <span class="logo">🔥 COCINA</span>
        <span id="ws-status" class="status off">···</span>
    </div>
    <div class="header-right">
        <span id="order-count" class="count">0</span>
        <button id="btn-sound" class="btn-s">🔊</button>
    </div>
</header>

<nav id="stations" class="stations">
    <button class="st-pill active" data-sid="all">Todas <span class="st-n" id="n-all">0</span></button>
</nav>

<main id="orders" class="orders">
    <div id="empty" class="empty">
        <div class="empty-icon">👨‍🍳</div>
        <div class="empty-text">Sin pedidos</div>
        <div class="empty-sub">Aparecerán aquí al instante</div>
    </div>
</main>

<div id="alert" class="alert-new hide">
    <div class="alert-box">
        <div class="alert-title">🔔 NUEVO PEDIDO</div>
        <div id="alert-detail" class="alert-detail"></div>
    </div>
</div>

<div id="pin-login" class="pin-overlay" style="display:none">
    <div class="pin-box">
        <div style="font-size:48px;margin-bottom:12px">🔥</div>
        <h2 style="font-size:22px;font-weight:900;margin-bottom:4px;color:#fff">COCINA</h2>
        <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:20px">Ingresa tu PIN</p>
        <input id="pin-input" type="tel" maxlength="6" placeholder="PIN"
            style="width:180px;padding:14px;font-size:24px;text-align:center;border:2px solid rgba(255,255,255,0.2);
            border-radius:12px;background:rgba(255,255,255,0.08);color:#fff;font-weight:900;letter-spacing:6px;
            font-family:monospace;outline:none" autocomplete="off">
        <br>
        <button id="pin-btn" onclick="doLogin()"
            style="margin-top:14px;padding:12px 40px;border:none;border-radius:12px;
            background:#e67e22;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
            font-family:inherit">Entrar</button>
        <p id="pin-error" style="color:#ef4444;font-size:12px;margin-top:10px;display:none"></p>
    </div>
</div>
<style>
    .pin-overlay{position:fixed;inset:0;z-index:200;background:#0a0a14;
        display:flex;align-items:center;justify-content:center;text-align:center}
    .pin-box{padding:32px}
    #pin-input:focus{border-color:#e67e22}
</style>

<script>
    window.KDS_CONFIG = {{ config | tojson }};
</script>
<script>
    (function(){
        var rid = window.KDS_CONFIG.restaurant_id;
        var token = localStorage.getItem('access_token');
        if (!token) {
            document.getElementById('pin-login').style.display = 'flex';
            return;
        }
        try {
            var payload = JSON.parse(atob(token.split('.')[1]));
            if (parseInt(payload.restaurant_id) !== rid || (payload.exp && payload.exp * 1000 < Date.now())) {
                localStorage.removeItem('access_token');
                document.getElementById('pin-login').style.display = 'flex';
                return;
            }
        } catch(e) {
            localStorage.removeItem('access_token');
            document.getElementById('pin-login').style.display = 'flex';
        }
    })();
    document.getElementById('pin-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
    function doLogin() {
        var pin = document.getElementById('pin-input').value;
        var rid = window.KDS_CONFIG.restaurant_id;
        var errEl = document.getElementById('pin-error');
        var btn = document.getElementById('pin-btn');
        if (!pin || pin.length < 4) { errEl.textContent = 'PIN de 4-6 dígitos'; errEl.style.display = 'block'; return; }
        btn.textContent = 'Conectando...'; btn.disabled = true;
        fetch('/api/v1/auth/login/pin', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({pin: pin, restaurant_id: rid})
        })
        .then(function(r) { if (!r.ok) throw new Error('PIN incorrecto'); return r.json(); })
        .then(function(data) {
            localStorage.setItem('access_token', data.access_token);
            document.getElementById('pin-login').style.display = 'none';
            location.reload();
        })
        .catch(function(e) {
            errEl.textContent = e.message; errEl.style.display = 'block';
            btn.textContent = 'Entrar'; btn.disabled = false;
        });
    }
</script>
<script src="/static/js/cocina_movil.js?v=6"></script>
</body>
</html>
