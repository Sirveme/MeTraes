<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Metraes.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f8fafc; --bg2: #fff; --text: #0f172a; --text2: #475569; --text3: #94a3b8;
    --blue: #2563eb; --blue-light: #eff6ff; --green: #16a34a; --green-light: #f0fdf4;
    --orange: #ea580c; --orange-light: #fff7ed; --purple: #7c3aed; --purple-light: #f5f3ff;
    --red: #dc2626; --red-light: #fef2f2; --cyan: #0891b2; --cyan-light: #ecfeff;
    --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --font: "DM Sans", system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }

.top-bar {
    background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color:#fff; padding:20px; text-align:center;
}
.top-bar h1 { font-size:22px; font-weight:800; margin-bottom:4px; }
.top-bar p { font-size:13px; color:rgba(255,255,255,0.6); }
.top-badge {
    display:inline-block; margin-top:8px; padding:4px 14px;
    background:rgba(255,255,255,0.1); border-radius:20px;
    font-size:12px; font-weight:700; color:rgba(255,255,255,0.8);
}

.container { max-width:480px; margin:0 auto; padding:16px; }

/* Section */
.section { margin-bottom:20px; }
.section-title {
    font-size:11px; font-weight:800; text-transform:uppercase;
    letter-spacing:1.5px; color:var(--text3); margin-bottom:10px;
    padding-left:4px;
}

/* Role cards */
.role-card {
    background:var(--bg2); border-radius:14px; padding:16px;
    border:1px solid var(--border); box-shadow:var(--shadow);
    margin-bottom:10px;
}
.role-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.role-icon {
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
}
.role-info { flex:1; }
.role-name { font-size:16px; font-weight:700; }
.role-desc { font-size:12px; color:var(--text2); }
.role-pin {
    font-size:11px; font-weight:700; padding:3px 10px;
    border-radius:6px; background:var(--bg); border:1px solid var(--border);
    font-family:monospace; letter-spacing:2px;
}

/* Action buttons */
.role-actions { display:flex; gap:8px; flex-wrap:wrap; }
.action-btn {
    flex:1; min-width:100px; padding:10px 12px; border:none; border-radius:10px;
    font-family:var(--font); font-size:13px; font-weight:700;
    cursor:pointer; text-align:center; text-decoration:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:opacity 0.15s;
}
.action-btn:active { opacity:0.7; }
.btn-open { background:var(--blue); color:#fff; }
.btn-share { background:var(--blue-light); color:var(--blue); }

/* Table grid for QR */
.mesa-grid {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
}
.mesa-pill {
    padding:8px 4px; border-radius:8px; border:1.5px solid var(--border);
    background:var(--bg2); text-align:center; cursor:pointer;
    font-size:12px; font-weight:700;
    transition:all 0.15s;
}
.mesa-pill:active { transform:scale(0.95); }
.mesa-pill .mn { display:block; font-size:14px; font-weight:800; }
.mesa-pill .mz { display:block; font-size:9px; color:var(--text3); margin-top:1px; }

/* Zone filter */
.zone-filter { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
.zone-btn {
    padding:5px 12px; border-radius:8px; border:1.5px solid var(--border);
    background:var(--bg2); font-family:var(--font); font-size:12px;
    font-weight:700; color:var(--text2); cursor:pointer; white-space:nowrap;
}
.zone-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }

/* Footer */
.footer {
    text-align:center; padding:20px; margin-top:20px;
    border-top:1px solid var(--border);
}
.footer-brand { font-size:18px; font-weight:800; color:var(--blue); }
.footer-tag { font-size:12px; color:var(--text3); margin-top:2px; }
.footer-link {
    display:inline-block; margin-top:8px; padding:8px 20px;
    background:var(--blue); color:#fff; border-radius:10px;
    text-decoration:none; font-size:13px; font-weight:700;
}

/* Toast */
.toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:10px 20px;
    border-radius:10px; font-size:13px; font-weight:600;
    opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:100;
}
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="top-bar">
    <h1 id="rest-name"></h1>
    <p>Sistema de gestión en vivo</p>
    <div class="top-badge">DEMO EN TIEMPO REAL</div>
</div>

<div class="container">

    <!-- ROLES -->
    <div class="section">
        <div class="section-title">👥 Accesos por rol</div>
        <div id="roles"></div>
    </div>

    <!-- CARTA VIRTUAL -->
    <div class="section">
        <div class="section-title">📱 Carta Virtual — Escanear desde mesa</div>
        <div id="zone-filter" class="zone-filter"></div>
        <div id="mesa-grid" class="mesa-grid"></div>
    </div>

</div>

<div class="footer">
    <div class="footer-brand">Metraes.com</div>
    <div class="footer-tag">Sistema POS para restaurantes</div>
    <a href="https://metraes.com" class="footer-link">Conocer más</a>
</div>

<div id="toast" class="toast"></div>

<script>
var CFG = {{ config | tojson }};
var BASE = CFG.base_url;
var RID = CFG.restaurant_id;

// Role config
var ROLES = [
    {
        key: "owner", icon: "👔", label: "Dueño / Admin", desc: "Ve todo: ventas, control, configuración",
        color: "#7c3aed", bg: "#f5f3ff",
        links: [
            {label: "Abrir POS Caja", url: BASE + "/pos?restaurant_id=" + RID, icon: "💰"},
        ]
    },
    {
        key: "waiter", icon: "🧑‍🍳", label: "Mesero", desc: "Toma pedidos, atiende mesas",
        color: "#2563eb", bg: "#eff6ff",
        links: [
            {label: "Abrir POS Mesero", url: BASE + "/pos?restaurant_id=" + RID, icon: "📝"},
        ]
    },
    {
        key: "kitchen", icon: "🔥", label: "Cocina", desc: "Ve pedidos, marca preparado/listo",
        color: "#ea580c", bg: "#fff7ed",
        links: [
            {label: "KDS Pantalla", url: BASE + "/cocina?restaurant_id=" + RID, icon: "🖥️"},
            {label: "KDS Celular", url: BASE + "/cocina/movil?restaurant_id=" + RID, icon: "📱"},
        ]
    },
    {
        key: "cashier", icon: "💰", label: "Cajero(a)", desc: "Cobra, emite boletas/facturas",
        color: "#16a34a", bg: "#f0fdf4",
        links: [
            {label: "Abrir Caja", url: BASE + "/pos?restaurant_id=" + RID, icon: "🧾"},
        ]
    },
];

function init() {
    document.getElementById("rest-name").textContent = CFG.restaurant_name;
    renderRoles();
    renderZones();
    renderMesas("all");
}

function renderRoles() {
    var container = document.getElementById("roles");
    ROLES.forEach(function(role) {
        var users = CFG.users.filter(function(u) { return u.role === role.key; });
        var pin = users.length > 0 ? users[0].pin : "----";

        var linksHtml = "";
        role.links.forEach(function(lnk) {
            linksHtml +=
                '<a class="action-btn btn-open" href="' + lnk.url + '" target="_blank">' +
                    lnk.icon + " " + lnk.label +
                '</a>';
        });
        linksHtml += '<button class="action-btn btn-share" onclick="shareRole(\'' +
            role.label + "','" + role.links[0].url + "')\">📤 Compartir</button>";

        var card = document.createElement("div");
        card.className = "role-card";
        card.innerHTML =
            '<div class="role-top">' +
                '<div class="role-icon" style="background:' + role.bg + '">' + role.icon + '</div>' +
                '<div class="role-info">' +
                    '<div class="role-name">' + role.label + '</div>' +
                    '<div class="role-desc">' + role.desc + '</div>' +
                '</div>' +
                '<div class="role-pin">PIN ' + pin + '</div>' +
            '</div>' +
            '<div class="role-actions">' + linksHtml + '</div>';
        container.appendChild(card);
    });
}

function renderZones() {
    var container = document.getElementById("zone-filter");
    var allBtn = document.createElement("button");
    allBtn.className = "zone-btn active";
    allBtn.textContent = "Todas";
    allBtn.onclick = function() { filterZone("all"); };
    allBtn.dataset.zid = "all";
    container.appendChild(allBtn);

    CFG.zones.forEach(function(z) {
        var btn = document.createElement("button");
        btn.className = "zone-btn";
        btn.textContent = z.short_name || z.name;
        btn.style.borderColor = z.color;
        btn.onclick = function() { filterZone(z.id); };
        btn.dataset.zid = z.id;
        container.appendChild(btn);
    });
}

function filterZone(zid) {
    document.querySelectorAll(".zone-btn").forEach(function(b) {
        b.classList.toggle("active", b.dataset.zid === String(zid));
    });
    renderMesas(zid);
}

function renderMesas(zoneId) {
    var grid = document.getElementById("mesa-grid");
    grid.innerHTML = "";
    var tables = CFG.tables;
    if (zoneId !== "all") {
        tables = tables.filter(function(t) { return t.zone_id === zoneId; });
    }
    tables.forEach(function(t) {
        var zone = CFG.zones.find(function(z) { return z.id === t.zone_id; });
        var pill = document.createElement("div");
        pill.className = "mesa-pill";
        if (zone) pill.style.borderColor = zone.color;
        pill.innerHTML = '<span class="mn">' + t.number + '</span>' +
            '<span class="mz">' + (zone ? zone.short_name : "") + '</span>';
        pill.onclick = function() {
            if (t.carta_url) {
                window.open(t.carta_url, "_blank");
            } else {
                showToast("Mesa sin QR asignado");
            }
        };
        grid.appendChild(pill);
    });
}

function shareRole(roleName, url) {
    var text = CFG.restaurant_name + " - " + roleName + "\n" + url;
    if (navigator.share) {
        navigator.share({title: roleName, text: text, url: url}).catch(function(){});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() {
            showToast("Link copiado al portapapeles");
        });
    } else {
        prompt("Copia este link:", url);
    }
}

function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function() { t.classList.remove("show"); }, 2500);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
